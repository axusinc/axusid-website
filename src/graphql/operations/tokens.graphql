query AccountTokens($auid: ID!) {
  accountTokens(auid: $auid) {
    tokenId
    title
    icon
    current
    permissions { grantId key context }
  }
}

mutation ApplyPermissionBatch($delegations: [PermissionDelegationInput!]!, $revocations: [PermissionRevocationInput!]!) {
  applyPermissionBatch(delegations: $delegations, revocations: $revocations) {
    delegated { id }
    revokedGrantIds
  }
}

mutation ChangeAccountTokenPresentation($auid: ID!, $tokenId: ID!, $title: String, $icon: String) {
  changeAccountTokenPresentation(auid: $auid, tokenId: $tokenId, title: $title, icon: $icon) {
    tokenId
    title
    icon
  }
}

mutation RevokeAccountToken($auid: ID!, $tokenId: ID!) {
  revokeAccountToken(auid: $auid, tokenId: $tokenId)
}
