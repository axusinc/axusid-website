type Query {
    user(auid: ID!): User
    usernames(auid: ID!): Usernames
    ownerByUsername(username: String!): ID
    # PostgreSQL regex (1..128 characters) against individual aliases, ordered by username; limit is 1..100.
    searchUsernames(regex: String!, limit: Int = 20): [UsernameMatch!]!
    variations(auid: ID!): [Variation!]!
    defaultVariation(auid: ID!): DefaultVariation
    name(variationId: ID!): Name
    description(variationId: ID!): Description
    avatar(variationId: ID!): Avatar
    status(variationId: ID!): Status
    parents(auid: ID!): Parents
    identities(contextAuid: ID!, recursive: Boolean = false, cursor: ID, limit: Int = 20): PaginatedIdentities!
    externalIdentities(auid: ID!): [ExternalIdentity!]!
    externalIdentityAccessToken(auid: ID!, externalIdentityId: ID!): ExternalIdentityAccessTokenResponse!
    passkeys(auid: ID!): [PasskeyCredential!]!
    isPasswordSet(auid: ID!): Boolean!
    # Permission reads require identity.<auid>.grants.read on the caller token.
    grants(auid: ID!): [PermissionGrant!]!
    # Distinct contexts of ALLOW permissions received directly or by delegation.
    # Requires identity.<auid>.grants.read. Includes stored grants that may not currently confer access.
    receivedPermissionContexts(auid: ID!): [ID!]!
    # Identity grants delegated by this identity; requires identity.<auid>.grants.read.
    # Includes grants that may not currently confer access. Excludes token and role recipients.
    delegatedGrants(auid: ID!): [PermissionGrant!]!
    checkPermission(auid: ID!, permission: String!, permissionContext: ID): PermissionCheck!
    permissionDeclarations(contextAuid: ID!): [PermissionDeclaration!]!
    describePermission(contextAuid: ID!, permission: String!): DescribedPermission!
    permissionTree(contextAuid: ID!): [PermissionTreeNode!]!
    searchPermissionValues(contextAuid: ID!, declarationId: ID!, param: String!, query: String!, limit: Int): ParamOption!
    # Presentation of the token in the Authorization header.
    tokenPresentation: TokenPresentation!
    # Tokens whose delegated grants trace to this identity; requires identity.<auid>.token.issue.
    accountTokens(auid: ID!): [AccountToken!]!
}


type Mutation {
    createUser(contextAuid: ID, registrationKey: ID!, title: String, icon: String): CreatedUser!
    addUsername(auid: ID!, username: String!): Usernames!
    removeUsername(auid: ID!, username: String!): Usernames!
    changeDefaultUsername(auid: ID!, username: String!): Usernames!
    changeUsername(auid: ID!, oldUsername: String!, newUsername: String!): Usernames!
    createVariation(auid: ID!, description: String, locationId: String, icon: String): Variation!
    changeName(auid: ID!, variationId: ID!, elements: [NameElementInput!]!): Name!
    changeDescription(auid: ID!, variationId: ID!, text: String): Description!
    clearDescription(auid: ID!, variationId: ID!): Description!
    requestAvatarUpload(auid: ID!, variationId: ID!, contentType: String!, sizeBytes: Int!): AvatarUploadRequest!
    confirmAvatarUpload(auid: ID!, variationId: ID!, objectKey: String!): Avatar!
    clearAvatar(auid: ID!, variationId: ID!): Avatar!
    changeStatus(auid: ID!, variationId: ID!, text: String, emoji: String, expiresAt: String, durationMinutes: Int): Status!
    clearStatus(auid: ID!, variationId: ID!): Status!
    changeVariationLocationId(auid: ID!, variationId: ID!, locationId: String): Variation!
    changeVariationIcon(auid: ID!, variationId: ID!, icon: String): Variation!
    setDefaultVariation(auid: ID!, variationId: ID!): DefaultVariation!
    requestParent(auid: ID!, parentAuid: ID!): Parents!
    acceptParent(auid: ID!, parentAuid: ID!): Parents!
    reorderParents(auid: ID!, parentAuids: [ID!]!): Parents!
    setPassword(auid: ID!, password: String!): Boolean!
    # `permissions` must contain at least one requested permission. Ask for "*" to delegate
    # the authenticating identity's permissions in the selected context.
    loginWithPassword(auid: ID!, password: String!, permissions: [String!], title: String, icon: String): Token!
    loginWithExternalIdentity(authentication: ExternalAuthenticationInput!, permissions: [String!], title: String, icon: String): AuthenticatedToken!
    loginWithToken(auid: ID!, permissions: [String!], permissionContext: ID, title: String, icon: String): Token!
    # Revokes the token sent in the Authorization header. Tokens delegated from it stop working too.
    revokeToken: Boolean!
    # Sets or clears the title and icon of the token in the Authorization header.
    setTokenPresentation(title: String, icon: String): TokenPresentation!
    # These operations require identity.<auid>.token.issue and a matching grant origin.
    changeAccountTokenPresentation(auid: ID!, tokenId: ID!, title: String, icon: String): TokenPresentation!
    revokeAccountToken(auid: ID!, tokenId: ID!): Boolean!
    linkExternalIdentity(auid: ID!, authentication: ExternalAuthenticationInput!): ExternalIdentity!
    unlinkExternalIdentity(auid: ID!, externalIdentityId: ID!): Boolean!
    startTotpEnrollment(auid: ID!, currentCode: String): TotpEnrollmentResponse!
    verifyTotpEnrollment(auid: ID!, code: String!): Boolean!
    loginWithTotp(totpToken: String!, code: String!, title: String, icon: String): AuthenticatedToken!
    startPasskeyRegistration(auid: ID!, displayName: String, relyingPartyId: String!): PasskeyCeremony!
    finishPasskeyRegistration(auid: ID!, challengeId: ID!, responseJson: String!, name: String): Boolean!
    updatePasskeyName(auid: ID!, credentialId: ID!, name: String!): Boolean!
    deletePasskey(auid: ID!, credentialId: ID!): Boolean!
    startPasskeyLogin(permissions: [String!], relyingPartyId: String!): PasskeyCeremony!
    loginWithPasskey(challengeId: ID!, responseJson: String!, title: String, icon: String): AuthenticatedToken!
    # Account recipients require grants.delegate; token recipients require token.issue,
    # ownership of the target token, and the requested permission on the caller token.
    delegatePermission(granterAuid: ID!, granteeAuid: ID, granteeTokenId: ID, permission: String!, permissionContext: ID): PermissionGrant!
    # Identity grants require the original granter's grants.delegate permission.
    # Token grants require granterAuid and that account's token.issue permission.
    revokeGrant(grantId: ID!, granterAuid: ID): Boolean!
    # Applies delegations before revocations in one transaction; any failure rolls back the batch.
    applyPermissionBatch(delegations: [PermissionDelegationInput!]!, revocations: [PermissionRevocationInput!]!): PermissionBatchResult!
    # Every app declares only under its own AUID. Requires grants.delegate for the owner.
    publishPermissionDeclaration(ownerAuid: ID!, declaration: PermissionDeclarationInput!): PermissionDeclaration!
    # App-side invalidation push: clears cached validator verdicts. Requires grants.delegate for the owner.
    notifyValidationChanged(declarationId: ID!): Boolean!
}

type PermissionCheck {
    allowed: Boolean!
    reason: String!
}

type PermissionGrant {
    id: ID!
    granteeAuid: ID
    granteeTokenId: ID
    permission: String!
    permissionContext: ID
    effect: PermissionGrantEffect!
    origin: PermissionGrantOrigin!
    activationState: PermissionGrantActivationState!
    isShadow: Boolean!
}

input PermissionDelegationInput {
    granterAuid: ID!
    granteeAuid: ID
    granteeTokenId: ID
    permission: String!
    permissionContext: ID
}

input PermissionRevocationInput {
    grantId: ID!
    granterAuid: ID
}

type PermissionBatchResult {
    delegated: [PermissionGrant!]!
    revokedGrantIds: [ID!]!
}

type PermissionDeclaration {
    id: ID!
    context: ID!
    name: String!
    version: Int!
    template: String!
    validatorUrl: String
    title: String
    description: String
    icon: String
    order: Int
}

input ParamDefInput {
    name: String!
    type: String = "STRING"
    allowWildcard: Boolean = false
    allowedValues: [String!]
    regex: String
    minLength: Int
    maxLength: Int
    minNumber: Float
    maxNumber: Float
    label: String
    description: String
    icon: String
    hint: String
}

input PermissionDeclarationInput {
    name: String!
    template: String!
    params: [ParamDefInput!] = []
    validatorUrl: String
    combinationInvariantJs: String
    title: String
    description: String
    icon: String
    # Lower values appear first; omitted orders follow ordered declarations by name.
    order: Int
}

type DescribedParam {
    name: String!
    value: String
    label: String
    description: String
    icon: String
    hint: String
    valueLabel: String
    valueIcon: String
}

type DescribedPermission {
    key: String!
    context: ID!
    declarationId: ID!
    title: String!
    description: String
    icon: String
    params: [DescribedParam!]!
}

type ValueOption {
    value: String!
    label: String
    icon: String
    description: String
}

type ParamOption {
    name: String!
    label: String
    values: [ValueOption!]!
    dynamic: Boolean!
    degraded: Boolean!
}

type PermissionTreeNode {
    keyPrefix: String!
    title: String
    declarations: [ID!]!
    params: [ParamOption!]!
    children: [PermissionTreeNode!]!
}

type PermissionGrantOrigin {
    type: PermissionGrantOriginType!
    delegatorAuid: ID
    delegatorTokenId: ID
}

enum PermissionGrantEffect {
    ALLOW
    DENY
}

enum PermissionGrantOriginType {
    DIRECT
    DELEGATED
    DELEGATED_BY_TOKEN
}

enum PermissionGrantActivationState {
    ACTIVE
    INACTIVE
    REQUIRES_APPROVAL
    TEMPORARILY_ACTIVE
}

type PasskeyCredential {
    credentialId: ID!
    auid: ID!
    transports: [String!]!
    backupEligible: Boolean!
    backedUp: Boolean!
    createdAt: String!
    lastUsedAt: String
    name: String
}


type PasskeyCeremony {
    challengeId: ID!
    optionsJson: String!
}

type TotpEnrollmentResponse {
    secret: String!
    otpauthUrl: String!
}


type Identity {
    auid: ID!
    id: ID!
}

type CreatedUser {
    auid: ID!
    token: Token!
}

type PaginatedIdentities {
    items: [Identity!]!
    nextCursor: ID
    hasNextPage: Boolean!
}

type User {
    identity: Identity!
    usernames: Usernames!
    defaultVariation: DefaultVariation
}

type Usernames {
    auid: ID!
    usernames: [String!]!
    defaultUsername: String!
}

type UsernameMatch {
    auid: ID!
    username: String!
}

type Variation {
    id: ID!
    auid: ID!
    locationId: String
    icon: String
    createdAt: String!
}

type Description {
    variationId: ID!
    text: String
    updatedAt: String!
}

type Avatar {
    variationId: ID!
    objectKey: String
    contentType: String
    sizeBytes: Int
    updatedAt: String!
}

type AvatarUploadRequest {
    variationId: ID!
    objectKey: String!
    uploadUrl: String!
    contentType: String!
    sizeBytes: Int!
    expiresAt: String!
}

type Status {
    variationId: ID!
    text: String
    emoji: String
    expiresAt: String
    updatedAt: String!
    isExpired: Boolean!
}

type Name {
    variationId: ID!
    elements: [NameElement!]!
    displayName: String!
}

type NameElement {
    partType: NamePartType
    value: String
    separatorType: NameSeparatorType
}

input NameElementInput {
    partType: NamePartType
    value: String
    separatorType: NameSeparatorType
}

enum NamePartType {
    TITLE
    GIVEN_NAME
    FAMILY_NAME
    GENERATION
    CREDENTIAL
    UNSTRUCTURED
}

enum NameSeparatorType {
    SPACE
    COMMA_SPACE
    HYPHEN
    APOSTROPHE
}

type DefaultVariation {
    auid: ID!
    variationId: ID!
}

type Parents {
    auid: ID!
    parents: [Parent!]!
}

type Parent {
    auid: ID!
    status: ParentStatus!
}

enum ParentStatus {
    PENDING
    ACCEPTED
}

type Token {
    # Send this as `Authorization: Bearer`. It is returned only here: the engine keeps the
    # token's public id and a hash of its secret, never the string itself.
    id: ID!
    title: String
    icon: String
}

type AuthenticatedToken {
    # Send this as `Authorization: Bearer`; see Token.id.
    id: ID!
    auid: ID!
    title: String
    icon: String
}

type TokenPresentation {
    tokenId: ID!
    title: String
    icon: String
}

type AccountTokenPermission {
    grantId: ID!
    key: String!
    context: ID!
}

type AccountToken {
    tokenId: ID!
    title: String
    icon: String
    permissions: [AccountTokenPermission!]!
    current: Boolean!
}

input ExternalAuthenticationInput {
    providerId: String!
    # A real provider refresh token. Access tokens and ID tokens are not accepted.
    refreshToken: String!
    clientId: String!
}

type ExternalIdentityAccessTokenResponse {
    accessToken: String!
    tokenType: String
    expiresIn: Int
    scopes: [String!]!
}

type ExternalIdentity {
    id: ID!
    providerId: String!
    createdAt: String!
}
