type Query {
    user(auid: ID!): User
    usernames(auid: ID!): Usernames
    ownerByUsername(username: String!): ID
    variations(auid: ID!): [Variation!]!
    defaultVariation(auid: ID!): DefaultVariation
    name(variationId: ID!): Name
    description(variationId: ID!): Description
    avatar(variationId: ID!): Avatar
    status(variationId: ID!): Status
    parents(auid: ID!): Parents
    identities(contextAuid: ID!, recursive: Boolean = false, cursor: ID, limit: Int = 20): PaginatedIdentities!
    externalIdentities(auid: ID!): [ExternalIdentity!]!
    externalIdentityAccessToken(auid: ID!, externalIdentityId: ID!): ExternalIdentityAccessTokenResponse!
    passkeys(auid: ID!): [PasskeyCredential!]!
    isPasswordSet(auid: ID!): Boolean!
    # Permission reads require identity.<auid>.grants.read on the caller token.
    grants(auid: ID!): [PermissionGrant!]!
    # Identity grants delegated by this identity; requires identity.<auid>.grants.read.
    # Includes grants that may not currently confer access. Excludes token and role recipients.
    delegatedGrants(auid: ID!): [PermissionGrant!]!
    checkPermission(auid: ID!, permission: String!): PermissionCheck!
}


type Mutation {
    createUser(contextAuid: ID, registrationKey: ID!): CreatedUser!
    addUsername(auid: ID!, username: String!): Usernames!
    removeUsername(auid: ID!, username: String!): Usernames!
    changeDefaultUsername(auid: ID!, username: String!): Usernames!
    changeUsername(auid: ID!, oldUsername: String!, newUsername: String!): Usernames!
    createVariation(auid: ID!, description: String, locationId: String, icon: String): Variation!
    changeName(auid: ID!, variationId: ID!, elements: [NameElementInput!]!): Name!
    changeDescription(auid: ID!, variationId: ID!, text: String): Description!
    clearDescription(auid: ID!, variationId: ID!): Description!
    requestAvatarUpload(auid: ID!, variationId: ID!, contentType: String!, sizeBytes: Int!): AvatarUploadRequest!
    confirmAvatarUpload(auid: ID!, variationId: ID!, objectKey: String!): Avatar!
    clearAvatar(auid: ID!, variationId: ID!): Avatar!
    changeStatus(auid: ID!, variationId: ID!, text: String, emoji: String, expiresAt: String, durationMinutes: Int): Status!
    clearStatus(auid: ID!, variationId: ID!): Status!
    changeVariationLocationId(auid: ID!, variationId: ID!, locationId: String): Variation!
    changeVariationIcon(auid: ID!, variationId: ID!, icon: String): Variation!
    setDefaultVariation(auid: ID!, variationId: ID!): DefaultVariation!
    requestParent(auid: ID!, parentAuid: ID!): Parents!
    acceptParent(auid: ID!, parentAuid: ID!): Parents!
    reorderParents(auid: ID!, parentAuids: [ID!]!): Parents!
    setPassword(auid: ID!, password: String!): Boolean!
    # `permissions` lists exactly what the new token may do. Omitting it, or passing an empty
    # list, issues a token with no permissions at all - ask for "*" to get everything the
    # authenticating identity holds.
    loginWithPassword(auid: ID!, password: String!, permissions: [String!]): Token!
    loginWithExternalIdentity(authentication: ExternalAuthenticationInput!, permissions: [String!]): AuthenticatedToken!
    loginWithToken(auid: ID!, permissions: [String!]): Token!
    # Revokes the token sent in the Authorization header. Tokens delegated from it stop working too.
    revokeToken: Boolean!
    linkExternalIdentity(auid: ID!, authentication: ExternalAuthenticationInput!): ExternalIdentity!
    unlinkExternalIdentity(auid: ID!, externalIdentityId: ID!): Boolean!
    startTotpEnrollment(auid: ID!, currentCode: String): TotpEnrollmentResponse!
    verifyTotpEnrollment(auid: ID!, code: String!): Boolean!
    loginWithTotp(totpToken: String!, code: String!): AuthenticatedToken!
    startPasskeyRegistration(auid: ID!, displayName: String, relyingPartyId: String!): PasskeyCeremony!
    finishPasskeyRegistration(auid: ID!, challengeId: ID!, responseJson: String!, name: String): Boolean!
    updatePasskeyName(auid: ID!, credentialId: ID!, name: String!): Boolean!
    deletePasskey(auid: ID!, credentialId: ID!): Boolean!
    startPasskeyLogin(permissions: [String!], relyingPartyId: String!): PasskeyCeremony!
    loginWithPasskey(challengeId: ID!, responseJson: String!): AuthenticatedToken!
    # Requires identity.<granterAuid>.grants.delegate on the caller token and
    # requires the granter identity to hold the requested permission.
    delegatePermission(granterAuid: ID!, granteeAuid: ID!, permission: String!): PermissionGrant!
    # Requires the original granter's grants.delegate permission.
    revokeGrant(grantId: ID!): Boolean!
}

type PermissionCheck {
    allowed: Boolean!
    reason: String!
}

type PermissionGrant {
    id: ID!
    granteeAuid: ID!
    permission: String!
    effect: PermissionGrantEffect!
    origin: PermissionGrantOrigin!
    activationState: PermissionGrantActivationState!
    isShadow: Boolean!
}

type PermissionGrantOrigin {
    type: PermissionGrantOriginType!
    delegatorAuid: ID
    delegatorTokenId: ID
}

enum PermissionGrantEffect {
    ALLOW
    DENY
}

enum PermissionGrantOriginType {
    DIRECT
    DELEGATED
    DELEGATED_BY_TOKEN
}

enum PermissionGrantActivationState {
    ACTIVE
    INACTIVE
    REQUIRES_APPROVAL
    TEMPORARILY_ACTIVE
}

type PasskeyCredential {
    credentialId: ID!
    auid: ID!
    transports: [String!]!
    backupEligible: Boolean!
    backedUp: Boolean!
    createdAt: String!
    lastUsedAt: String
    name: String
}


type PasskeyCeremony {
    challengeId: ID!
    optionsJson: String!
}

type TotpEnrollmentResponse {
    secret: String!
    otpauthUrl: String!
}


type Identity {
    auid: ID!
    id: ID!
}

type CreatedUser {
    auid: ID!
    token: Token!
}

type PaginatedIdentities {
    items: [Identity!]!
    nextCursor: ID
    hasNextPage: Boolean!
}

type User {
    identity: Identity!
    usernames: Usernames!
    defaultVariation: DefaultVariation
}

type Usernames {
    auid: ID!
    usernames: [String!]!
    defaultUsername: String!
}

type Variation {
    id: ID!
    auid: ID!
    locationId: String
    icon: String
    createdAt: String!
}

type Description {
    variationId: ID!
    text: String
    updatedAt: String!
}

type Avatar {
    variationId: ID!
    objectKey: String
    contentType: String
    sizeBytes: Int
    updatedAt: String!
}

type AvatarUploadRequest {
    variationId: ID!
    objectKey: String!
    uploadUrl: String!
    contentType: String!
    sizeBytes: Int!
    expiresAt: String!
}

type Status {
    variationId: ID!
    text: String
    emoji: String
    expiresAt: String
    updatedAt: String!
    isExpired: Boolean!
}

type Name {
    variationId: ID!
    elements: [NameElement!]!
    displayName: String!
}

type NameElement {
    partType: NamePartType
    value: String
    separatorType: NameSeparatorType
}

input NameElementInput {
    partType: NamePartType
    value: String
    separatorType: NameSeparatorType
}

enum NamePartType {
    TITLE
    GIVEN_NAME
    FAMILY_NAME
    GENERATION
    CREDENTIAL
    UNSTRUCTURED
}

enum NameSeparatorType {
    SPACE
    COMMA_SPACE
    HYPHEN
    APOSTROPHE
}

type DefaultVariation {
    auid: ID!
    variationId: ID!
}

type Parents {
    auid: ID!
    parents: [Parent!]!
}

type Parent {
    auid: ID!
    status: ParentStatus!
}

enum ParentStatus {
    PENDING
    ACCEPTED
}

type Token {
    # Send this as `Authorization: Bearer`. It is returned only here: the engine keeps the
    # token's public id and a hash of its secret, never the string itself.
    id: ID!
}

type AuthenticatedToken {
    # Send this as `Authorization: Bearer`; see Token.id.
    id: ID!
    auid: ID!
}

input ExternalAuthenticationInput {
    providerId: String!
    refreshToken: String!
    clientId: String!
}

type ExternalIdentityAccessTokenResponse {
    accessToken: String!
    tokenType: String
    expiresIn: Int
    scopes: [String!]!
}

type ExternalIdentity {
    id: ID!
    providerId: String!
    createdAt: String!
}
